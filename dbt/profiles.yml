vayba:
  target: "{{ env_var('VAYBA_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('VAYBA_LOCAL_DB', 'vayba_local.duckdb') }}"
      schema: DEV_HUGO
      settings: {TimeZone: UTC}
      threads: 1
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake' if env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') else 'externalbrowser') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'VAYBA_WH') }}"
      database: VAYBA
      schema: DEV_HUGO
      threads: 1
